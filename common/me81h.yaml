# Wspólna konfiguracja termostatu ME81H (Tuya MCU, produkt gogb05wrtredz3bs).
# Plik urządzenia musi zdefiniować substitutions:
#   name, friendly_name, board, status_pin_inverted

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp8266:
  board: ${board}

logger:
  baud_rate: 0 # UART0 zajęty przez Tuya MCU

api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "ME81"
    password: !secret ap_password

captive_portal:

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Warsaw
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - 2.pool.ntp.org

tuya:
  id: tuyamcu
  time_id: sntp_time
  status_pin:
    number: GPIO14
    # TYWE3S: true (bez tego brak ikonki WiFi i czasu na panelu), ESP-12F: false
    inverted: ${status_pin_inverted}

climate:
  - platform: tuya
    tuya_id: tuyamcu
    name: "ME81H"
    switch_datapoint: 1
    target_temperature_datapoint: 16
    current_temperature_datapoint: 24
    supports_heat: true
    active_state:
      datapoint: 36
      heating_value: 0 # 0 = grzeje, 1 = idle (sprawdzone)
    current_temperature_multiplier: 0.1
    target_temperature_multiplier: 1
    visual:
      min_temperature: 5
      max_temperature: 40
      temperature_step:
        target_temperature: 1
        current_temperature: 0.5 # czujnik mierzy co 0,5°C

select:
  - platform: tuya
    name: "Tryb pracy"
    enum_datapoint: 2
    options:
      0: Auto
      1: Ręczny

  - platform: tuya
    name: "Harmonogram dni"
    enum_datapoint: 102
    options:
      0: Wyłączony
      1: 5 (Pn-Pt)
      2: 6 (Pn-Sob)
      3: 7 (Pn-Ndz)

  - platform: tuya
    name: "Wybór sensora"
    enum_datapoint: 43
    options:
      0: Wewnętrzny
      1: Zewnętrzny
      2: Oba

switch:
  - platform: tuya
    name: "Antyzamarzanie"
    switch_datapoint: 10

  - platform: tuya
    name: "Blokada panelu"
    switch_datapoint: 40

number:
  # Bez datapoint_hidden: MCU sam raportuje DP 27 i 101, a hidden nadpisywał je przy starcie.
  - platform: tuya
    name: "Kalibracja"
    number_datapoint: 27
    min_value: -9
    max_value: 9
    step: 1

  - platform: tuya
    name: "Próg aktywacji"
    number_datapoint: 101
    min_value: 1
    max_value: 5
    step: 1

  - platform: tuya
    name: "Temperatura maksymalna"
    number_datapoint: 19
    min_value: 30
    max_value: 90
    step: 1

sensor:
  - platform: tuya
    name: "Kod błędu"
    sensor_datapoint: 45 # bitmaska, 0 = OK
    entity_category: diagnostic
